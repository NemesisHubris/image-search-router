<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google Images for Brave Search</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <img src="icons/icon.svg" width="40" height="40" alt="">
      <div>
        <h1>Google Images</h1>
        <p>for Brave Search</p>
      </div>
    </header>
    <main>
      <label class="toggle-row">
        <span>Use Google Images</span>
        <input id="enabled" type="checkbox" role="switch" aria-describedby="status" disabled>
        <span class="switch-track" aria-hidden="true"></span>
      </label>
      <p id="status" role="status">Loading your setting…</p>
    </main>
  </body>
</html>
