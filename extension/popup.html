<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Search Router</title>
    <link rel="stylesheet" href="popup.css">
    <script src="engines.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <img src="icons/icon.svg" width="40" height="40" alt="">
      <div>
        <h1>Image Search Router</h1>
        <p>Your search. Your image engine.</p>
      </div>
    </header>
    <main>
      <label class="toggle-row">
        <span>Enable routing</span>
        <input id="enabled" type="checkbox" role="switch" aria-describedby="status" disabled>
        <span class="switch-track" aria-hidden="true"></span>
      </label>
      <p id="status" role="status">Loading your choices…</p>
      <div class="column-labels" aria-hidden="true">
        <span>When searching on</span><span>Open images with</span>
      </div>
      <div id="routes" aria-label="Image search destinations"></div>
      <details id="custom-section">
        <summary>Custom image engines</summary>
        <ul id="custom-engines"></ul>
        <form id="custom-form" novalidate>
          <label for="custom-name">Name</label>
          <input id="custom-name" type="text" maxlength="40" placeholder="My image search" required>
          <label for="custom-url">Image search URL</label>
          <input id="custom-url" type="url" placeholder="https://example.com/images?q={query}"
            aria-describedby="custom-help error" autocomplete="off" spellcheck="false" required>
          <p id="custom-help">Put <code>{query}</code> where the search words go.</p>
          <button type="submit">Add engine</button>
        </form>
      </details>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
