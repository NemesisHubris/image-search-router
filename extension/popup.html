<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Search for Brave</title>
    <link rel="stylesheet" href="popup.css">
    <script src="engines.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <img src="icons/icon.svg" width="40" height="40" alt="">
      <div>
        <h1>Image Search</h1>
        <p>for Brave Search</p>
      </div>
    </header>
    <main>
      <label class="toggle-row">
        <span>Use another engine</span>
        <input id="enabled" type="checkbox" role="switch" aria-describedby="status" disabled>
        <span class="switch-track" aria-hidden="true"></span>
      </label>
      <p id="status" role="status">Loading your setting…</p>
      <div class="engine-choice">
        <label for="engine">Image search engine</label>
        <select id="engine" disabled></select>
      </div>
      <form id="custom-form" hidden novalidate>
        <label for="custom-url">Your search URL</label>
        <input id="custom-url" type="url" placeholder="https://example.com/images?q={query}"
          aria-describedby="custom-help error" autocomplete="off" spellcheck="false">
        <p id="custom-help">Use <code>{query}</code> where the search words go.</p>
        <button type="submit">Save engine</button>
      </form>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
