<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Search Router</title>
    <link rel="stylesheet" href="popup.css">
    <script src="engines.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <img src="icons/icon.svg" width="36" height="36" alt="">
      <div>
        <h1>Image Search Router</h1>
        <p>Your search. Your image engine.</p>
      </div>
      <label class="toggle-row" title="Enable routing">
        <input id="enabled" type="checkbox" role="switch" aria-label="Enable routing" disabled>
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </header>
    <main>
      <div class="column-labels" aria-hidden="true">
        <span>Searching on</span><span></span><span>Open images with</span>
      </div>
      <div id="routes" aria-label="Image search routes"></div>
      <button id="add-route" class="add-route" type="button" disabled>
        <span aria-hidden="true">+</span> Add route
      </button>
      <p id="status" role="status">Loading your choices…</p>
      <section id="custom-editor" hidden aria-labelledby="editor-title">
        <h2 id="editor-title">Custom engine</h2>
        <form id="custom-form" novalidate>
          <label for="custom-name">Name</label>
          <input id="custom-name" type="text" maxlength="40" placeholder="My search engine" required>
          <div id="source-fields" hidden>
            <label for="custom-source-url">Web search URL</label>
            <input id="custom-source-url" type="url" placeholder="https://search.example.com/?q={query}">
          </div>
          <label for="custom-url">Image search URL</label>
          <input id="custom-url" type="url" placeholder="https://search.example.com/images?q={query}" required>
          <p class="help">Replace the search words in each URL with <code>{query}</code>.</p>
          <details id="source-options" hidden>
            <summary>Advanced</summary>
            <label for="custom-selector">Images button selector (optional)</label>
            <input id="custom-selector" type="text" placeholder="e.g. #images-tab">
            <p class="help">For sites whose Images button is not a normal navigation link.</p>
          </details>
          <div class="form-actions">
            <button type="submit">Save engine</button>
            <button id="cancel-custom" class="quiet" type="button">Cancel</button>
          </div>
        </form>
      </section>
      <details id="custom-section" hidden>
        <summary>Saved custom engines</summary>
        <ul id="custom-engines"></ul>
      </details>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
